# AEGIS development / pilot stack.
#   cp .env.example .env   (then set AEGIS_SECRET_KEY etc.)
#   docker compose up --build
# Optional profiles: --profile s3 (MinIO object storage), --profile scan (ClamAV).
# Services bind to 127.0.0.1 only; put a TLS-terminating reverse proxy in front for any shared use.

x-api-env: &api-env
  AEGIS_MODE: ${AEGIS_MODE:-demo}
  AEGIS_ENVIRONMENT: ${AEGIS_ENVIRONMENT:-development}
  AEGIS_SECRET_KEY: ${AEGIS_SECRET_KEY:?set AEGIS_SECRET_KEY in .env}
  AEGIS_DATABASE_URL: postgresql+psycopg://aegis:${POSTGRES_PASSWORD:-aegis-dev-only}@postgres:5432/aegis
  AEGIS_REDIS_URL: redis://redis:6379/0
  AEGIS_TASK_MODE: celery
  AEGIS_STORAGE_BACKEND: ${AEGIS_STORAGE_BACKEND:-local}
  AEGIS_STORAGE_ROOT: /var/lib/aegis/evidence
  AEGIS_S3_BUCKET: ${AEGIS_S3_BUCKET:-aegis-evidence}
  AEGIS_S3_ENDPOINT_URL: ${AEGIS_S3_ENDPOINT_URL:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AEGIS_CORS_ORIGINS: ${AEGIS_CORS_ORIGINS:-http://localhost:3000}
  AEGIS_COOKIE_SECURE: ${AEGIS_COOKIE_SECURE:-false}
  AEGIS_REQUIRE_MALWARE_SCAN: ${AEGIS_REQUIRE_MALWARE_SCAN:-false}
  AEGIS_CLAMAV_HOST: ${AEGIS_CLAMAV_HOST:-}
  AEGIS_ALLOW_EXTERNAL_PROCESSING: ${AEGIS_ALLOW_EXTERNAL_PROCESSING:-false}
  AEGIS_REFERENCE_WATERMARK_KEY: ${AEGIS_REFERENCE_WATERMARK_KEY:-}
  AEGIS_C2PA_TRUST_ANCHORS: ${AEGIS_C2PA_TRUST_ANCHORS:-}
  AEGIS_DEMO_PASSWORD: ${AEGIS_DEMO_PASSWORD:-Aegis-Demo-Only-2026}

x-api-image: &api-image
  image: aegis-api:${AEGIS_VERSION:-dev}
  build:
    context: .
    dockerfile: infrastructure/docker/api.Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis-dev-only}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  minio:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-aegis-dev}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-aegis-dev-only-secret}
    volumes: [miniodata:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]

  clamav:
    profiles: ["scan"]
    image: clamav/clamav:1.4
    ports: ["127.0.0.1:3310:3310"]

  migrate:
    <<: *api-image
    environment: *api-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli sync"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: *api-image
    environment: *api-env
    volumes: [evidence:/var/lib/aegis]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    <<: *api-image
    environment: *api-env
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "aegis,aegis-research", "-c", "2", "--loglevel=INFO"]
    volumes: [evidence:/var/lib/aegis]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 >/dev/null"]
      interval: 60s
      timeout: 20s
      retries: 3
    stop_grace_period: 60s
    restart: unless-stopped

  beat:
    <<: *api-image
    environment: *api-env
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "-s", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    image: aegis-web:${AEGIS_VERSION:-dev}
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        AEGIS_API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  evidence:
