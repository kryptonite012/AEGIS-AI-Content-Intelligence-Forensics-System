[project]
name = "aegis-research"
version = "0.1.0"
description = "AEGIS statistical reliability engine, reference watermark and research experiments"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.9,<4"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aegis_research"]
