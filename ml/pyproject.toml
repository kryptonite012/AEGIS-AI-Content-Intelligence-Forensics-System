[project]
name = "aegis-ml"
version = "0.1.0"
description = "AEGIS forensic analysis methods: text, image, audio, video, provenance, evidence fusion"
requires-python = ">=3.11"
dependencies = [
  "aegis-research",
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "pillow>=11.0,<12",
  "pypdf>=5.1,<6",
  "python-docx>=1.1,<2",
  "langdetect>=1.0.9,<2",
  "c2pa-python>=0.38,<0.39",
  "httpx>=0.28,<1",
  "cryptography>=44,<47",
]

[project.optional-dependencies]
# Local transformer-based detectors. Weights are NOT bundled; see docs/research/model-cards.md.
transformers = ["torch>=2.5,<3", "transformers>=4.46,<5"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aegis_ml"]
