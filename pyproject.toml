[project]
name = "aegis-workspace"
version = "0.1.0"
description = "AEGIS monorepo workspace (virtual root)"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "ml", "research"]

[tool.uv.sources]
aegis-ml = { workspace = true }
aegis-research = { workspace = true }
aegis-api = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<7",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "moto[s3]>=5.0,<6",
  "pip-audit>=2.7,<3",
  "httpx>=0.28,<1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "B008", "S311", "UP042"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["research/tests", "ml/tests", "apps/api/tests"]
addopts = "-q"
